%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/samsung,s5k2l7.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung S5K2L7 12MP CMOS image sensor

maintainers:
  - Kulesha Evgeniy <voovdop@gmail.com>

description: |
  The S5K2L7 is a 12 megapixel (4032x3024) RAW10 CMOS image sensor with a
  MIPI CSI-2 (D-PHY, 4 lanes) interface, controlled over I2C.

allOf:
  - $ref: /schemas/media/video-interface-devices.yaml#

properties:
  compatible:
    const: samsung,s5k2l7

  reg:
    maxItems: 1

  clocks:
    description: MCLK supply clock.
    maxItems: 1

  reset-gpios:
    description: Active low GPIO connected to the RESET pad of the sensor.
    maxItems: 1

  dovdd-supply:
    description: Digital I/O supply (1.8 V).

  dvdd-supply:
    description: Digital core supply (1.2 V).

  avdd-supply:
    description: Analog supply (2.8 V).

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    additionalProperties: false

    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false

        properties:
          data-lanes:
            items:
              - const: 1
              - const: 2
              - const: 3
              - const: 4

          link-frequencies:
            maxItems: 1

        required:
          - data-lanes
          - link-frequencies

    required:
      - endpoint

required:
  - compatible
  - reg
  - clocks
  - reset-gpios
  - dovdd-supply
  - dvdd-supply
  - avdd-supply
  - port

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        camera@10 {
            compatible = "samsung,s5k2l7";
            reg = <0x10>;

            clocks = <&cam_clk>;
            reset-gpios = <&tlmm 48 GPIO_ACTIVE_LOW>;

            dovdd-supply = <&vreg_dovdd>;
            dvdd-supply = <&vreg_dvdd>;
            avdd-supply = <&vreg_avdd>;

            port {
                endpoint {
                    data-lanes = <1 2 3 4>;
                    link-frequencies = /bits/ 64 <666000000>;
                    remote-endpoint = <&camss_csi0_in>;
                };
            };
        };
    };
...
