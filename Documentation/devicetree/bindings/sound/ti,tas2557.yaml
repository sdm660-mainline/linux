%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/ti,tas2557.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Texas Instruments TAS2557 Mono Smart Amplifier

maintainers:
  - Gianluca Boiano <morf3089@gmail.com>

description: |
  The TAS2557 is a mono, digital-input Class-D audio amplifier with an
  integrated DSP for speaker protection. Audio is received over I2S/TDM
  (ASI), processed by the on-chip DSP firmware, and output to the ClassD
  power stage. The device exposes a single ASoC DAI labelled ASI2.

  Stereo playback is built from two TAS2557 devices, each assigned a
  different TDM slot via the ti,channel property; such boards usually load
  a stereo-tuned DSP blob (e.g. tas2557s_uCDSP.bin) named via firmware-name.

  A DSP firmware binary (tas2557_uCDSP.bin for PG2.x hardware, or
  tas2557_pg1p0_uCDSP.bin for PG1.0) must be present in the system
  firmware search path; audio cannot pass through the device without it.

  Datasheet: https://www.ti.com/lit/gpn/tas2557

properties:
  compatible:
    const: ti,tas2557

  reg:
    maxItems: 1
    description: I2C device address, typically 0x4c or 0x4d.

  '#sound-dai-cells':
    const: 0

  reset-gpios:
    maxItems: 1
    description: |
      GPIO used to reset the device. Drive high to deassert (enable).
      Request with GPIOD_OUT_HIGH so the device is enabled after probe.
      Also accepted via the legacy property name "ti,cdc-reset".

  irq-gpios:
    maxItems: 1
    description: GPIO connected to the device IRQ/FAULT output (active-low).

  interrupts:
    maxItems: 1

  vdd-supply:
    description: Digital core supply, nominally 1.8 V.

  vbat-supply:
    description: Battery / speaker supply voltage, 3.6 V – 5.5 V.

  pvdd-supply:
    description: Class-D output stage supply.

  ti,i2s-bit-width:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: I2S word length in bits.
    default: 16
    enum: [16, 20, 24, 32]

  ti,channel:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: |
      I2S channel to receive audio from (0 = left, 1 = right). With stereo
      firmware (two TAS2557s sharing one DSP blob) this also selects which
      per-amplifier tuning is applied: channel 0 loads the device-A blocks,
      channel 1 the device-B blocks.
    default: 0
    enum: [0, 1]

  ti,imon-slot:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: TDM TX time slot for current-sense data output.
    default: 0
    minimum: 0
    maximum: 15

  ti,vmon-slot:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: TDM TX time slot for voltage-sense data output.
    default: 2
    minimum: 0
    maximum: 15

  firmware-name:
    $ref: /schemas/types.yaml#/definitions/string
    description:
      DSP firmware blob to load from the firmware search path. Overrides
      the default selected from the detected PG silicon revision. Dual-amp
      stereo boards typically use a stereo-tuned blob such as
      "tas2557s_uCDSP.bin".

required:
  - compatible
  - reg
  - '#sound-dai-cells'

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        codec@4c {
            compatible = "ti,tas2557";
            reg = <0x4c>;
            #sound-dai-cells = <0>;

            reset-gpios = <&tlmm 77 GPIO_ACTIVE_HIGH>;
            irq-gpios = <&tlmm 73 GPIO_ACTIVE_LOW>;

            vdd-supply = <&vreg_l10a_1p8>;
            vbat-supply = <&battery>;
            pvdd-supply = <&vreg_bob>;

            ti,i2s-bit-width = <16>;
            ti,channel = <0>;
            ti,imon-slot = <0>;
            ti,vmon-slot = <2>;
        };
    };
