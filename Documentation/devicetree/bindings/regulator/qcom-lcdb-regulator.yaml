%YAML 1.2
---
$id: http://devicetree.org/schemas/regulator/qcom-lcdb-regulator.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm's LCDB (LCD Bias) Regulator

maintainers:
  - Alexey Minnekhanov <alexeymin@minlexx.ru>

description:
  LCDB module provides voltage bias to the LCD display panel. The biases
  are positive (supported by LDO) and negative (supported by NCP) voltage
  signals. Currently implemented for PM660L PMIC.

properties:
  compatible:
    enum:
      - qcom,pm660l-lcdb

  reg:
    maxItems: 1
  
  interrupts:
    description:
      Short-circuit interrupt, common for both LDO and NCP.

  interrupt-names:
    items:
      - const: sc-irq

  ldo:
    type: object
    $ref: regulator.yaml#
    unevaluatedProperties: false

  ncp:
    type: object
    $ref: regulator.yaml#
    unevaluatedProperties: false

required:
  - compatible
  - reg
  - interrupts
  - interrupt-names

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>
    #include <dt-bindings/spmi/spmi.h>

    pmic@3 {
      compatible = "qcom,pm660l", "qcom,spmi-pmic";
      reg = <0x3 SPMI_USID>;
      #address-cells = <1>;
      #size-cells = <0>;
      regulator@ec00 {
        compatible = "qcom,pm660l-lcdb";
        reg = <0xec00>;
        interrupts = <0x3 0xec 0x1 IRQ_TYPE_EDGE_RISING>;
        interrupt-names = "sc-irq";

        ldo {
          regulator-name = "lcdb_ldo";
          regulator-min-microvolt = <4000000>;
          regulator-max-microvolt = <6000000>;
        };

        ncp {
          regulator-name = "lcdb_ncp";
          regulator-min-microvolt = <4000000>;
          regulator-max-microvolt = <6000000>;
        };
      };
    };

...
