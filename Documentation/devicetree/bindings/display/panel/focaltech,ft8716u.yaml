%YAML 1.2
---
$id: http://devicetree.org/schemas/display/panel/focaltech,ft8716u.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Focaltech FT8716U MIPI-DSI panel

maintainers:
  - Alexey Minnekhanov <alexeymin@minlexx.ru>

description:
  Focaltech FT8716U 5.5" 1080x1920 LCD panel found in Nokia 6.1 smartphone.

allOf:
  - $ref: panel-common.yaml#

properties:
  compatible:
    items:
      - const: focaltech,ft8716u

  reg:
    maxItems: 1

  iovcc-supply:
    description: I/O voltage rail

  vsn-supply:
    description: Negative source voltage rail

  vsp-supply:
    description: Positive source voltage rail

required:
  - compatible
  - reg
  - reset-gpios
  - port

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    dsi {
        #address-cells = <1>;
        #size-cells = <0>;

        panel@0 {
            compatible = "focaltech,ft8716u";
            reg = <0>;
            backlight = <&backlight>;
            reset-gpios = <&tlmm 53 GPIO_ACTIVE_LOW>;

            port {
                panel_in: endpoint {
                    remote-endpoint = <&dsi_out>;
                };
            };
        };
    };

...
