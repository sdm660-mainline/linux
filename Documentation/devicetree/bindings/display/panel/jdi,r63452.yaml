%YAML 1.2
---
$id: http://devicetree.org/schemas/display/panel/jdi,r63452.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: JDI R63452 MIPI-DSI panels

maintainers:
  - Alexey Minnekhanov <alexeymin@minlexx.ru>

description:
  JDI R63452 MIPI-DSI panels 1080x1920 LCD panel found in several smartphones.

allOf:
  - $ref: panel-common.yaml#

properties:
  compatible:
    items:
      - const: jdi,fhd-r63452

  reg:
    maxItems: 1

  vddio-supply:
    description: I/O voltage rail

  avdd-supply:
    description: Positive source voltage rail

  avee-supply:
    description: Negative source voltage rail

required:
  - compatible
  - reg
  - reset-gpios
  - port

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    dsi {
        #address-cells = <1>;
        #size-cells = <0>;

        panel@0 {
            compatible = "jdi,fhd-r63452";
            reg = <0>;
            backlight = <&backlight>;
            reset-gpios = <&tlmm 53 GPIO_ACTIVE_LOW>;

            port {
                panel_in: endpoint {
                    remote-endpoint = <&dsi_out>;
                };
            };
        };
    };

...
