%YAML 1.2
---
$id: http://devicetree.org/schemas/display/panel/syna,td4310.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Synaptics TD4310 DSI Display Panel

maintainers:
  - Paul Sajna <hello@paulsajna.com>

allOf:
  - $ref: panel-common.yaml#

properties:
  compatible:
    enum:
      - syna,td4310

  reg:
    maxItems: 1

  reset-gpios:
    description: specifies a GPIO used for the rest pin

  backlight:
    description: phandle of the backlight device attached to the panel

  vddio-supply:
    description: power IC supply regulator

  vddpos-supply:
    description: positive boost supply regulator

  vddneg-supply:
    description: negative boost supply regulator

  port: true
  width-mm: true
  height-mm: true

required:
  - compatible
  - reg
  - reset-gpios
  - vddio-supply
  - vddpos-supply
  - vddneg-supply

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    dsi {
      #address-cells = <1>;
      #size-cells = <0>;
      panel@0 {
        compatible = "syna,td4310";
        reg = <0>;
        reset-gpios = <&tlmm 53 GPIO_ACTIVE_LOW>;

        vddio-supply = <&vreg_l11a_1p8>;
        vddpos-supply = <&lab>;
        vddneg-supply = <&ibb>;

        backlight = <&pm660l_wled>;
        width-mm = <63>;
        height-mm = <95>;

        port {
          panel_in: endpoint {
            remote-endpoint = <&mdss_dsi0_out>;
          };
        };
      };
    };
