%YAML 1.2
---
$id: http://devicetree.org/schemas/display/panel/boe,td4300.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: BOE TD4300 MIPI-DSI panel

maintainers:
  - Fabricio Akio <fabricioakio@gmail.com>

description:
  BOE 5.2" 1080x1920 video mode panel driven by a Synaptics TD4300
  touch and display driver integration controller, found in the
  Motorola Moto X4 smartphone.

allOf:
  - $ref: panel-common.yaml#

properties:
  compatible:
    items:
      - const: boe,td4300

  reg:
    maxItems: 1

  vddio-supply:
    description: I/O voltage rail

  vsn-supply:
    description: Negative source voltage rail

  vsp-supply:
    description: Positive source voltage rail

required:
  - compatible
  - reg
  - reset-gpios
  - vddio-supply
  - port

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    dsi {
        #address-cells = <1>;
        #size-cells = <0>;

        panel@0 {
            compatible = "boe,td4300";
            reg = <0>;
            backlight = <&backlight>;
            reset-gpios = <&tlmm 53 GPIO_ACTIVE_LOW>;
            vddio-supply = <&vreg_l11a_1p8>;

            port {
                panel_in: endpoint {
                    remote-endpoint = <&dsi_out>;
                };
            };
        };
    };

...
